{# VISITOR header: the tenant's brand (brand.yaml name + logo), never the Fleet lockup; same header spec. #}
<header class="fds-header">
  <span class="tenant"><img src="{{ brand.logo }}" alt="">{{ brand.name }}</span>
  <div class="fds-header__utils"><button type="button" class="fds-btn" data-fds-theme-toggle>Theme</button></div>
</header>
