name: Chief native images
on:
  push:
    branches: ['chief/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chief-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: test "$(docker info --format '{{.Architecture}}')" = "$(test "$ARCH" = arm64 && echo aarch64 || echo x86_64)"
      - name: Build
        env:
          IMAGE: ghcr.io/dwhly/chief-send
          ARCH: ${{ matrix.arch }}
        run: |
          docker build -t coneshare-core:latest -f core/Dockerfile core
          docker build -t coneshare-frontend:latest --build-arg VITE_APP_VERSION=chief --build-arg VITE_GIT_SHA="$GITHUB_SHA" -f frontend/Dockerfile frontend
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t coneshare:latest -f backend/Dockerfile backend
      - name: Native runtime smoke
        run: |
          docker run --rm --memory=512m --entrypoint sh coneshare:latest -ec 'libreoffice --headless --version; pdftoppm -v; python -c "import pypdf, pdf2image; from PIL import Image; print(pypdf.__version__)"; test -x /home/coneshare/app/core-serv'
      - name: Save checked image
        run: docker save coneshare:latest -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
  publish:
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/checked
      - name: Load checked image without executing it
        run: docker load -i "$RUNNER_TEMP/checked/image.tar"
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture image
        env:
          IMAGE: ghcr.io/dwhly/chief-send
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag coneshare:latest "$IMAGE:$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:$GITHUB_SHA-$ARCH"
  manifest:
    needs: [build, publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Publish immutable commit manifest
        env:
          IMAGE: ghcr.io/dwhly/chief-send
        run: |
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" | tee manifest.txt
          cat manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-manifest
          path: manifest.txt
