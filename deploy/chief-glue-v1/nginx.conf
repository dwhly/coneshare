upstream app_server { server localhost:9998; }
server {
  listen 80 default_server;
  client_max_body_size 50m;
  server_name _;
  root /home/coneshare/app/frontend/dist;
  add_header Referrer-Policy no-referrer always;
  location = / { return 302 /signing/; }
  location /signing/ { try_files $uri @app; }
  location /view/ { rewrite ^/view/([^/]+)/?$ /signing/room/$1 last; }
  location /mcp { proxy_pass http://mcp:8001; proxy_buffering off; proxy_read_timeout 300s; }
  location /api/ { try_files $uri @app; }
  location /files { return 404; }
  location /media/ { return 404; }
  location /admin/ { return 404; }
  location /api-auth/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
  location @app {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://app_server;
  }
}
