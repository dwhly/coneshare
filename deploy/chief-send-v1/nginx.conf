
  upstream app_server {
    # fail_timeout=0 means we always retry an upstream even if it failed
    # to return a good HTTP response

    # # for UNIX domain socket setups
    # server unix:/tmp/gunicorn.sock fail_timeout=0;

    # for a TCP configuration
    server localhost:9998 fail_timeout=0;

  }

  upstream file_server {
    # fail_timeout=0 means we always retry an upstream even if it failed
    # to return a good HTTP response

    # # for UNIX domain socket setups
    # server unix:/tmp/gunicorn.sock fail_timeout=0;

    # for a TCP configuration
    server localhost:8080 fail_timeout=0;

  }

  # server {
  #   # if no Host match, close the connection to prevent host spoofing
  #   listen 80 default_server;
  #   return 444;
  # }

  server {
    # use 'listen 80 deferred;' for Linux
    # use 'listen 80 accept_filter=httpready;' for FreeBSD
    listen 80 default_server;
    client_max_body_size 50M;

    # set the correct host(s) for your site
    server_name _;

    keepalive_timeout 5;

    # Real IP configuration for deployments behind trusted reverse proxies (Cloudflare, Traefik, ALB, etc.)
    include /home/coneshare/runtime/nginx/real-ip.conf;

    # path for static files
    root /home/coneshare/app/frontend/dist;
    index index.html;

    # Cache immutable Vite static assets (JS/CSS/images/fonts)
    location /assets/ {
      include /home/coneshare/runtime/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
    }

    # SPA entrypoint - never cache index.html
    location = /index.html {
      include /home/coneshare/runtime/nginx/security-headers.conf;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /view/ {
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      try_files $uri /index.html;
    }
    location / {
      # checks for static file, if not found proxy to app
      # try_files $uri @proxy_to_app;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      # checks for static file, if not found proxy to app
      try_files $uri @proxy_to_app;
    }

    location /media/ {
      return 404;
    }

    location /mcp/ { proxy_pass http://mcp:8001; proxy_set_header Host $http_host; proxy_buffering off; }

    location /files { return 404; }
    location /admin/ { return 404; }
    location /api-auth/ { return 404; }

    location @proxy_to_app {
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;
      proxy_pass http://app_server;
    }

    location @proxy_to_file_serv {
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;
      proxy_pass http://file_server;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
      root /home/coneshare/app/frontend/dist;
    }
  }

